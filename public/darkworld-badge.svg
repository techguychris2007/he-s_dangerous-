<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <!-- Light comes from the upper left throughout: rims, face, globe and lettering share it. -->
    <linearGradient id="rim" x1="40" y1="20" x2="280" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DCE4FF"/>
      <stop offset=".22" stop-color="#8FA6FF"/>
      <stop offset=".5" stop-color="#4560D8"/>
      <stop offset=".74" stop-color="#22336F"/>
      <stop offset=".9" stop-color="#6F8BFF"/>
      <stop offset="1" stop-color="#1A2654"/>
    </linearGradient>
    <linearGradient id="bevel" x1="160" y1="17" x2="160" y2="303" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05080F"/>
      <stop offset="1" stop-color="#5D78E8"/>
    </linearGradient>
    <radialGradient id="face" cx="118" cy="96" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1F2D4D"/>
      <stop offset=".55" stop-color="#121B30"/>
      <stop offset="1" stop-color="#080D19"/>
    </radialGradient>
    <linearGradient id="arc" x1="40" y1="60" x2="280" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B9C8FF"/>
      <stop offset=".5" stop-color="#6384FF"/>
      <stop offset="1" stop-color="#3349B0"/>
    </linearGradient>
    <radialGradient id="sphere" cx="26" cy="25" r="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D3DDFF"/>
      <stop offset=".35" stop-color="#8CA4FF"/>
      <stop offset=".8" stop-color="#4964DA"/>
      <stop offset="1" stop-color="#26388A"/>
    </radialGradient>
    <linearGradient id="ring" x1="10" y1="20" x2="54" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".6" stop-color="#DCE4FF"/>
      <stop offset="1" stop-color="#8FA0D8"/>
    </linearGradient>
    <linearGradient id="letters" x1="0" y1="192" x2="0" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".6" stop-color="#E4EAFF"/>
      <stop offset="1" stop-color="#A9B9F2"/>
    </linearGradient>
    <linearGradient id="sheen" x1="90" y1="20" x2="150" y2="135" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity=".04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="raised" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="2.4" flood-color="#000" flood-opacity=".7"/>
      <feDropShadow dx="0" dy="-1" stdDeviation=".3" flood-color="#C9D5FF" flood-opacity=".35"/>
    </filter>
    <filter id="engraved" x="-10%" y="-40%" width="120%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1" stdDeviation=".2" flood-color="#000" flood-opacity=".8"/>
    </filter>
    <filter id="cast" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <clipPath id="faceClip"><circle cx="160" cy="160" r="141"/></clipPath>
  </defs>

  <!-- Coin body: thick metallic rim, a recessed bevel, then the face. -->
  <g filter="url(#cast)">
    <circle cx="160" cy="160" r="152" fill="url(#rim)"/>
  </g>
  <circle cx="160" cy="160" r="151" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="1"/>
  <circle cx="160" cy="160" r="145" fill="url(#bevel)"/>
  <circle cx="160" cy="160" r="141" fill="url(#face)"/>
  <circle cx="160" cy="160" r="133" stroke="#34466F" stroke-opacity=".9"/>
  <circle cx="160" cy="161" r="133" stroke="#000" stroke-opacity=".35"/>

  <g filter="url(#raised)">
    <path d="M40 130a123 123 0 0 1 240 0M40 190a123 123 0 0 0 240 0" stroke="url(#arc)" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="32" cy="160" r="3.4" fill="#C3D0FF"/>
    <circle cx="288" cy="160" r="3.4" fill="#8FA4F0"/>
  </g>

  <g transform="translate(80 38) scale(2.5)" filter="url(#raised)">
    <ellipse cx="32" cy="32" rx="25" ry="9" transform="rotate(-25 32 32)" stroke="url(#ring)" stroke-width="2.8"/>
    <circle cx="32" cy="32" r="16.5" fill="#0B1222"/>
    <circle cx="32" cy="32" r="14.5" fill="url(#sphere)"/>
    <ellipse cx="32" cy="32" rx="6.5" ry="14.5" stroke="#25396B" stroke-opacity=".85" stroke-width="1.5"/>
    <path d="M18.5 27h27M18.5 37h27M32 17.5v29" stroke="#25396B" stroke-opacity=".85" stroke-width="1.5"/>
    <ellipse cx="26.5" cy="24" rx="5" ry="3" transform="rotate(-30 26.5 24)" fill="#FFFFFF" fill-opacity=".45"/>
    <path d="M7 32a25 9 0 0 0 50 0" transform="rotate(-25 32 32)" stroke="#0B1222" stroke-width="6"/>
    <path d="M7 32a25 9 0 0 0 50 0" transform="rotate(-25 32 32)" stroke="url(#ring)" stroke-width="2.8"/>
  </g>

  <g filter="url(#raised)">
    <text x="160" y="224" fill="url(#letters)" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" letter-spacing="-1" text-anchor="middle">DarkWorld</text>
  </g>
  <text x="161" y="249" fill="#B7C7FF" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="600" letter-spacing="3.6" text-anchor="middle" filter="url(#engraved)">CYBER ACADEMY</text>
  <path d="M134 270h52" stroke="url(#arc)" stroke-width="2.2" stroke-linecap="round" filter="url(#engraved)"/>

  <!-- Gloss across the upper face. -->
  <g clip-path="url(#faceClip)">
    <path d="M10 10h300v118c-60 34-180 38-300-6z" fill="url(#sheen)"/>
  </g>
</svg>
