<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- DarkWorld 3D mark: extruded navy badge, lit indigo planet, gold orbit passing in front, satellite node. -->
  <defs>
    <linearGradient id="dw-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3263"/>
      <stop offset="0.55" stop-color="#151b3a"/>
      <stop offset="1" stop-color="#0b0f22"/>
    </linearGradient>
    <linearGradient id="dw-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dw-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.45" stop-color="#5468ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5468ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dw-planet" cx="0.36" cy="0.3" r="0.78">
      <stop offset="0" stop-color="#e6eaff"/>
      <stop offset="0.16" stop-color="#9eabff"/>
      <stop offset="0.48" stop-color="#5468ee"/>
      <stop offset="0.8" stop-color="#2b3480"/>
      <stop offset="1" stop-color="#141a42"/>
    </radialGradient>
    <linearGradient id="dw-shade" x1="0.2" y1="0.15" x2="0.9" y2="0.95">
      <stop offset="0.45" stop-color="#090c20" stop-opacity="0"/>
      <stop offset="1" stop-color="#090c20" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="dw-ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6323"/>
      <stop offset="0.35" stop-color="#f3dca3"/>
      <stop offset="0.7" stop-color="#c9a15f"/>
      <stop offset="1" stop-color="#8a6323"/>
    </linearGradient>
    <radialGradient id="dw-node" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#c3cbff"/>
      <stop offset="1" stop-color="#a3aeff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="dw-cut"><circle cx="32" cy="31" r="16.6"/></clipPath>
    <clipPath id="dw-globe"><circle cx="32" cy="32" r="14.5"/></clipPath>
    <filter id="dw-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="0.9"/></filter>
  </defs>

  <!-- extruded badge -->
  <rect x="3" y="6.5" width="58" height="55" rx="14" fill="#04060e"/>
  <rect x="3" y="5" width="58" height="55" rx="14" fill="#1d2550"/>
  <rect x="3" y="2.5" width="58" height="55" rx="14" fill="url(#dw-tile)"/>
  <rect x="3.6" y="3.1" width="56.8" height="53.8" rx="13.4" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
  <path d="M5 16c0-6.6 5.4-11.5 12-11.5h30c6.6 0 12 4.9 12 11.5v2.5H5z" fill="url(#dw-gloss)"/>

  <!-- orbit, back half -->
  <ellipse cx="32" cy="31" rx="26" ry="8.5" transform="rotate(-22 32 31)" stroke="url(#dw-ring)" stroke-width="2.2" stroke-opacity="0.55"/>

  <!-- planet -->
  <circle cx="32" cy="31" r="20" fill="url(#dw-halo)"/>
  <circle cx="32" cy="31" r="15.6" fill="#0b0f22"/>
  <g transform="translate(0 -1)">
    <circle cx="32" cy="32" r="14.5" fill="url(#dw-planet)"/>
    <g clip-path="url(#dw-globe)" stroke="#dfe4ff" stroke-opacity="0.32" stroke-width="0.9">
      <ellipse cx="32" cy="32" rx="6.2" ry="14.5"/>
      <path d="M17.5 26.5Q32 23.6 46.5 26.5M16.8 32h30.4M17.5 37.5Q32 40.4 46.5 37.5M32 17.5v29"/>
    </g>
    <circle cx="32" cy="32" r="14.5" fill="url(#dw-shade)"/>
    <ellipse cx="26.2" cy="24.6" rx="4.6" ry="2.6" transform="rotate(-32 26.2 24.6)" fill="#ffffff" fill-opacity="0.55" filter="url(#dw-soft)"/>
  </g>

  <!-- orbit, front half (cut-out then gold) -->
  <g clip-path="url(#dw-cut)"><path d="M6 31a26 8.5 0 0 0 52 0" transform="rotate(-22 32 31)" stroke="#0b0f22" stroke-width="5.2"/></g>
  <path d="M6 31a26 8.5 0 0 0 52 0" transform="rotate(-22 32 31)" stroke="url(#dw-ring)" stroke-width="2.8" stroke-linecap="round"/>

  <!-- satellite node -->
  <circle cx="13.3" cy="43.4" r="4.2" fill="url(#dw-node)"/>
  <circle cx="13.3" cy="43.4" r="1.6" fill="#ffffff"/>
</svg>
