<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f1424" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DarkWorld" />
    <meta name="description" content="DarkWorld Academy — pre-security foundations, offensive and defensive learning paths, interactive labs, and a professional portfolio of practice evidence." />
    <title>DarkWorld — Cybersecurity Academy</title>
    <!-- Google Fonts: Inter (UI/body) + Plus Jakarta Sans (headings/display) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('darkworld.theme.v2');
          var theme = saved === 'light' ? 'light' : 'dark';
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
