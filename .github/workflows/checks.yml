# Runs on every push to main and every pull request, so a broken change is caught before it
# reaches learners. Uses no secrets: the build and checks run without the Supabase keys.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check and build
        run: npm run build

      - name: Platform checks
        run: npm run test:platform

      - name: Additional checks
        run: |
          npm run test:engagements
          npm run test:navigation
          npm run test:ml-library
          npm run test:offline-library
          npm run test:offline-workspace
          npm run test:achievement-awards
          npm run test:dig-shell
          npm run test:documents
